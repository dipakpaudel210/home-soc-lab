<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Home SOC Lab Network Architecture</title>
<desc>A host laptop running VMware Workstation hosts four active VMs and one planned VM on an isolated host-only network VMnet3, subnet 192.168.50.0/24. Kali Linux at 192.168.50.20 is the attacker. Windows 11 at 192.168.50.11 and Rocky Linux at 192.168.50.13 are targets with Wazuh agents enrolled. Ubuntu at 192.168.50.10 runs the Wazuh SIEM manager, indexer and dashboard. ParrotSec is a planned second attacker, not yet added. All active VMs also have a second NAT adapter for internet access, separate from the lab segment.</desc>

<rect width="960" height="620" fill="#ffffff"/>

<!-- Outer host boundary -->
<rect x="20" y="20" width="920" height="580" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
<text x="40" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Host Laptop — VMware Workstation (32 GB RAM)</text>

<!-- Internet cloud -->
<ellipse cx="850" cy="90" rx="80" ry="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="850" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Internet</text>

<!-- NAT label -->
<line x1="850" y1="128" x2="850" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
<text x="850" y="150" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">NAT</text>
<rect x="770" y="165" width="160" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="850" y="184" font-family="Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Updates / downloads only</text>

<!-- VMnet3 switch bar -->
<rect x="60" y="330" width="700" height="14" rx="7" fill="#1f4e79"/>
<text x="410" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f4e79" text-anchor="middle">VMnet3 — Host-Only Lab Network — 192.168.50.0/24</text>

<!-- Kali -->
<rect x="60" y="150" width="170" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="145" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Kali Linux</text>
<text x="145" y="200" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle">Attacker</text>
<text x="145" y="222" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#991b1b" text-anchor="middle">192.168.50.20</text>
<text x="145" y="240" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">Nmap, Hydra,</text>
<text x="145" y="253" font-family="Arial, sans-serif" font-size="10.5" fill="#7f1d1d" text-anchor="middle">enum4linux</text>
<line x1="145" y1="260" x2="145" y2="330" stroke="#dc2626" stroke-width="2"/>

<!-- Windows 11 -->
<rect x="270" y="150" width="170" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="355" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Windows 11</text>
<text x="355" y="200" font-family="Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">Target — window11</text>
<text x="355" y="222" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">192.168.50.11</text>
<text x="355" y="240" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af" text-anchor="middle">Wazuh agent</text>
<text x="355" y="253" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af" text-anchor="middle">(agent.id 001)</text>
<line x1="355" y1="260" x2="355" y2="330" stroke="#2563eb" stroke-width="2"/>

<!-- Ubuntu / Wazuh -->
<rect x="480" y="150" width="170" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="565" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Ubuntu Server</text>
<text x="565" y="200" font-family="Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle">SIEM — wazuh-manager</text>
<text x="565" y="222" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14532d" text-anchor="middle">192.168.50.10</text>
<text x="565" y="240" font-family="Arial, sans-serif" font-size="10.5" fill="#166534" text-anchor="middle">Wazuh manager,</text>
<text x="565" y="253" font-family="Arial, sans-serif" font-size="10.5" fill="#166534" text-anchor="middle">indexer, dashboard</text>
<line x1="565" y1="260" x2="565" y2="330" stroke="#16a34a" stroke-width="2"/>

<!-- Rocky Linux - now active -->
<rect x="60" y="400" width="170" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="145" y="428" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Rocky Linux</text>
<text x="145" y="446" font-family="Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">Target — rockylinux</text>
<text x="145" y="468" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">192.168.50.13</text>
<text x="145" y="486" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af" text-anchor="middle">Wazuh agent enrolled</text>
<line x1="145" y1="390" x2="145" y2="344" stroke="#2563eb" stroke-width="2"/>

<!-- Planned hosts (dashed / muted) -->
<rect x="270" y="400" width="170" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,4"/>
<text x="355" y="428" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">ParrotSec</text>
<text x="355" y="446" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Planned attacker</text>
<text x="355" y="464" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">192.168.50.21</text>
<line x1="355" y1="390" x2="355" y2="344" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,3"/>

<!-- NAT lines from active hosts up to cloud -->
<path d="M 230 175 C 500 60, 650 60, 770 100" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
<path d="M 440 175 C 550 80, 650 80, 770 105" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
<path d="M 650 175 C 700 130, 730 120, 770 112" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="620" y="105" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">each VM: 2nd NIC (NAT)</text>

<!-- Legend -->
<rect x="700" y="500" width="200" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="712" y="512" width="14" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="732" y="523" font-family="Arial, sans-serif" font-size="11" fill="#334155">Attacker</text>
<rect x="712" y="532" width="14" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="732" y="543" font-family="Arial, sans-serif" font-size="11" fill="#334155">Target (Wazuh agent)</text>
<rect x="712" y="552" width="14" height="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="732" y="563" font-family="Arial, sans-serif" font-size="11" fill="#334155">SIEM (Wazuh)</text>
</svg>
